# Evaluation cases for the incident-investigation scenario.
#
# Release 0.1 ships the one canonical incident that every recipe is built around, so the
# comparison across architectures is apples-to-apples. Add more cases here (e.g. a healthy
# pipeline, a different failure mode) to broaden coverage in later releases.

cases:
  - id: orders_daily_schema_break
    goal: The 'orders_daily' pipeline has failed. Investigate and report the root cause.
    pipeline: orders_daily
    expected_root_cause: schema mismatch
    expected_tools:
      - query_logs
      - check_data_quality
      - list_recent_deployments
