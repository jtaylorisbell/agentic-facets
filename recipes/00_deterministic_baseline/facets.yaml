name: deterministic-baseline
description: >
  A fixed, code-directed investigation of a failed data pipeline. No model, no agent — the
  developer defines the entire execution graph. The non-agentic control for the cookbook.

feedback:
  mode: open-loop
  mechanisms:
    - deterministic-validation

authority:
  level: advisory
  allowed_actions: []

control:
  mode: code-directed

execution:
  pattern: sequential

topology:
  pattern: none

state:
  durability: request-local
  memory: none
  source_of_truth: environmental
