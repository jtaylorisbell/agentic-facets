recipe: 00_deterministic_baseline
case:
  id: orders_daily_schema_break
  goal: Investigate why the orders_daily pipeline failed and report the likely root cause.
  pipeline: orders_daily
  expected_root_cause: schema mismatch
  # The baseline calls tools by fixed rule, not by model choice; we still expect these to run.
  expected_tools:
    - get_pipeline_status
    - query_logs
    - query_metrics
    - check_data_quality
    - list_recent_deployments
