name: manager-worker
description: >
  A manager agent owns the question and delegates focused subtasks to two specialist workers with
  disjoint toolsets — a researcher that reads documents and a calculator that only computes —
  each in an isolated context. Same problem and control mode as the single agent, with the
  Topology axis changed from single-agent to manager-worker. The manager stays responsible
  (contrast handoff).

feedback:
  mode: closed-loop
  mechanisms:
    - environmental-verification

authority:
  level: advisory
  allowed_actions: []

control:
  mode: model-directed
  boundaries:
    max_steps: 12

execution:
  pattern: planner-executor

topology:
  pattern: manager-worker

state:
  durability: request-local
  memory: context-only
  source_of_truth: environmental
