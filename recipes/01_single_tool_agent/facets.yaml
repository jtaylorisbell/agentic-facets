name: single-document-agent
description: >
  One agent with read-only document tools (list/search/read/compute) scoped to a question's
  source documents. Model-directed control: the model chooses which tool to call and when it can
  answer; code only bounds the loop (max_steps). Same problem as the closed-book baseline, with
  the Control axis flipped from code-directed to model-directed and document access added.

feedback:
  mode: closed-loop
  mechanisms:
    - environmental-verification

authority:
  level: advisory
  allowed_actions: []

control:
  mode: model-directed
  boundaries:
    max_steps: 16
    allowed_tools:
      - list_source_documents
      - search_document
      - read_document
      - compute

execution:
  pattern: planner-executor

topology:
  pattern: single-agent

state:
  durability: request-local
  memory: context-only
  source_of_truth: environmental
