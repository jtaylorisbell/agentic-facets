name: single-tool-agent
description: >
  One agent, read-only tools, model-directed control. The model chooses which tool to call and
  when to stop; code only bounds the loop (max_steps). Same problem as the deterministic
  baseline, with the Control axis flipped from code-directed to model-directed.

feedback:
  mode: closed-loop
  mechanisms:
    - environmental-verification

authority:
  level: advisory
  allowed_actions: []

control:
  mode: model-directed
  boundaries:
    max_steps: 8
    allowed_tools:
      - get_pipeline_status
      - query_logs
      - query_metrics
      - check_data_quality
      - list_recent_deployments

execution:
  pattern: planner-executor

topology:
  pattern: single-agent

state:
  durability: request-local
  memory: context-only
  source_of_truth: environmental
