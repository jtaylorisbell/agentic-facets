name: parallel-investigation
description: >
  One investigator per source document runs concurrently via asyncio.gather, each in its own
  context and trace, then fans in to a synthesizer that combines their findings. Changes from the
  single document agent along one axis: Execution from sequential reads to parallel fan-out/fan-in.
  Cuts latency (wall-clock is the slowest branch) but not token cost (every branch still runs).

feedback:
  mode: closed-loop
  mechanisms:
    - environmental-verification

authority:
  level: advisory
  allowed_actions: []

control:
  mode: model-directed
  boundaries:
    max_steps: 8

execution:
  pattern: parallel

topology:
  pattern: manager-worker

state:
  durability: request-local
  memory: context-only
  source_of_truth: environmental
