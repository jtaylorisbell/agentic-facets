name: parallel-investigation
description: >
  Four independent investigators (logs, metrics, data-quality, deployments) run concurrently via
  asyncio.gather, each in its own context and trace, then fan in to a synthesizer. Changes from
  manager-worker along one axis: Execution from sequential delegation to parallel fan-out/fan-in.
  Cuts latency (wall-clock is the slowest branch) but not token cost (every branch still runs).

feedback:
  mode: closed-loop
  mechanisms:
    - environmental-verification

authority:
  level: advisory
  allowed_actions: []

control:
  mode: model-directed
  boundaries:
    max_steps: 4

execution:
  pattern: parallel

topology:
  pattern: manager-worker

state:
  durability: request-local
  memory: context-only
  source_of_truth: environmental
